[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "0.1.0"
description = "Auditable enterprise RAG and reliable agent platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.99,<2",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "PyMuPDF>=1.26,<2",
  "pwdlib[argon2]>=0.2,<1",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0.43,<3",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10,<8",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "testcontainers[postgres,redis]>=4.12,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires Docker-backed infrastructure"]

[tool.coverage.run]
branch = true
source = ["opspilot"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opspilot"]
