name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev]"
      # Pre-migration: a fresh database has no extensions yet (0001 creates them), so
      # only verify connectivity here. Extension checks must run after alembic upgrade head.
      - name: Verify PostgreSQL and Redis connectivity
        run: |
          python - <<'EOF'
          import asyncio

          import asyncpg
          import redis

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opspilot:opspilot@localhost:5432/opspilot"
              )
              assert await connection.fetchval("SELECT 1") == 1
              await connection.close()
              assert redis.Redis.from_url("redis://localhost:6379/0").ping()

          asyncio.run(main())
          EOF
      - name: Run database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Verify extensions and migration head
        run: |
          python - <<'EOF'
          import asyncio

          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://opspilot:opspilot@localhost:5432/opspilot"
              )
              rows = await connection.fetch("SELECT extname FROM pg_extension")
              assert {"vector", "pgcrypto"} <= {row["extname"] for row in rows}
              await connection.close()

          asyncio.run(main())
          EOF
          python -m alembic -c backend/alembic.ini current | grep -q "(head)"
      - name: Run quality gates and full test suite
        run: make check
